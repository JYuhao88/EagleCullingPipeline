<!doctype html>
<meta charset="utf-8">
<title>小红书笔记导出 书签</title>
<body style="font-family:-apple-system,sans-serif;max-width:640px;margin:48px auto;line-height:1.7">
<h2>小红书笔记导出</h2>
<p>把下面的按钮拖到 Edge 收藏夹栏（没显示收藏夹栏就按 <kbd>⇧⌘B</kbd>）：</p>
<p><a href="javascript:(() =&gt; {%0A  const q = (sel, root = document) =&gt; root.querySelector(sel);%0A  const qa = (sel, root = document) =&gt; Array.from(root.querySelectorAll(sel));%0A  const text = (el) =&gt; (el ? el.innerText.trim() : &quot;&quot;);%0A  const count = (sel, root) =&gt; {%0A    const t = text(q(sel, root));%0A    if (!t) return null;%0A    const m = t.match(/([%5Cd.]+)%5Cs*(%E4%B8%87|w)?/i);%0A    if (!m) return null;%0A    return Math.round(parseFloat(m[1]) * (m[2] ? 10000 : 1));%0A  };%0A%0A  const noteId = (location.pathname.match(/%5C/(?:explore|discovery%5C/item|search_result)%5C/([0-9a-f]+)/) || [])[1] || null;%0A  const container = q(&quot;%23noteContainer&quot;) || q(&quot;.note-container&quot;) || document;%0A  const returnMode = Boolean(window.__xhsExportReturn);%0A  if (!q(&quot;%23detail-desc&quot;, container) &amp;&amp; !q(&quot;%23detail-title&quot;, container)) {%0A    if (returnMode) return JSON.stringify({ error: &quot;no-note&quot;, url: location.href });%0A    alert(&quot;%E6%B2%A1%E6%89%BE%E5%88%B0%E7%AC%94%E8%AE%B0%E5%86%85%E5%AE%B9%EF%BC%9A%E8%AF%B7%E5%85%88%E6%89%93%E5%BC%80%E4%B8%80%E7%AF%87%E7%AC%94%E8%AE%B0%E8%AF%A6%E6%83%85%E5%86%8D%E7%82%B9%E5%87%BB%E3%80%82&quot;);%0A    return;%0A  }%0A%0A  const comment = (el) =&gt; ({%0A    text: text(q(&quot;.content&quot;, el) || q(&quot;.note-text&quot;, el)),%0A    likes: count(&quot;.like .count, .like-wrapper .count&quot;, el),%0A    isAuthor: /%E4%BD%9C%E8%80%85/.test(text(q(&quot;.tag&quot;, el))),%0A    date: text(q(&quot;.date&quot;, el)) || null,%0A  });%0A%0A  const comments = qa(&quot;.parent-comment&quot;, container).map((p) =&gt; {%0A    const top = q(&quot;.comment-item&quot;, p) || p;%0A    return {%0A      ...comment(top),%0A      replies: qa(&quot;.reply-container .comment-item, .comment-item-sub&quot;, p).map(comment),%0A    };%0A  });%0A%0A  const imgs = qa(&quot;.swiper-slide:not(.swiper-slide-duplicate) img, .media-container img&quot;, container);%0A  const out = {%0A    source: &quot;xiaohongshu&quot;,%0A    contractVersion: 1,%0A    noteId,%0A    url: noteId ? %60https://www.xiaohongshu.com/explore/%24{noteId}%60 : location.origin + location.pathname,%0A    capturedAt: new Date().toISOString(),%0A    title: text(q(&quot;%23detail-title&quot;, container)),%0A    desc: text(q(&quot;%23detail-desc .note-text&quot;, container) || q(&quot;%23detail-desc&quot;, container)),%0A    tags: qa(&quot;%23detail-desc a.tag, %23hash-tag&quot;, container).map((a) =&gt; text(a)).filter(Boolean),%0A    date: text(q(&quot;.bottom-container .date&quot;, container)) || null,%0A    imageCount: new Set(imgs.map((i) =&gt; i.src)).size,%0A    counts: {%0A      likes: count(&quot;.interact-container .like-wrapper .count&quot;, container),%0A      collects: count(&quot;.interact-container .collect-wrapper .count&quot;, container),%0A      comments: count(&quot;.interact-container .chat-wrapper .count&quot;, container),%0A    },%0A    comments,%0A    loadedComments: comments.length + comments.reduce((n, c) =&gt; n + c.replies.length, 0),%0A  };%0A%0A  if (returnMode) return JSON.stringify(out);%0A%0A  const blob = new Blob([JSON.stringify(out, null, 2)], { type: &quot;application/json&quot; });%0A  const a = document.createElement(&quot;a&quot;);%0A  a.href = URL.createObjectURL(blob);%0A  a.download = %60xhs-%24{noteId || &quot;note&quot;}-%24{Date.now()}.json%60;%0A  document.body.appendChild(a);%0A  a.click();%0A  a.remove();%0A  setTimeout(() =&gt; URL.revokeObjectURL(a.href), 5000);%0A%0A  const tip = document.createElement(&quot;div&quot;);%0A  tip.textContent = %60%E5%B7%B2%E5%AF%BC%E5%87%BA%EF%BC%9A%24{out.comments.length} %E6%9D%A1%E8%AF%84%E8%AE%BA%EF%BC%88%E5%90%AB%E5%9B%9E%E5%A4%8D%E5%85%B1 %24{out.loadedComments}%EF%BC%89%60;%0A  Object.assign(tip.style, {%0A    position: &quot;fixed&quot;, top: &quot;16px&quot;, left: &quot;50%&quot;, transform: &quot;translateX(-50%)&quot;, zIndex: 99999,%0A    background: &quot;%23222&quot;, color: &quot;%23fff&quot;, padding: &quot;8px 16px&quot;, borderRadius: &quot;8px&quot;, fontSize: &quot;14px&quot;,%0A  });%0A  document.body.appendChild(tip);%0A  setTimeout(() =&gt; tip.remove(), 2500);%0A})();" style="display:inline-block;padding:8px 16px;background:#ff2442;color:#fff;border-radius:8px;text-decoration:none">导出小红书笔记</a></p>
<ol>
<li>正常打开一篇笔记详情。</li>
<li>在评论区往下滚，让想要的评论（和"展开回复"）加载出来。</li>
<li>点收藏夹栏里的「导出小红书笔记」，JSON 会下载到「下载」文件夹。</li>
</ol>
<p>只导出正文、标签、互动数和评论文本，不含用户名、头像、主页链接。</p>
</body>
